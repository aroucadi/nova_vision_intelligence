<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nova-gradient-banner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
    <filter id="glow-banner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Mark (Left) -->
  <g transform="translate(100, 50) scale(0.6)">
    <circle cx="256" cy="256" r="200" stroke="url(#nova-gradient-banner)" stroke-width="32" stroke-linecap="round" filter="url(#glow-banner)" />
    <circle cx="256" cy="256" r="80" fill="url(#nova-gradient-banner)" />
    <path d="M420 256 L460 256 M256 420 L256 460 M92 256 L52 256 M256 92 L256 52" stroke="url(#nova-gradient-banner)" stroke-width="24" stroke-linecap="round" />
  </g>

  <!-- Text (Right) -->
  <text x="450" y="240" font-family="Arial, sans-serif" font-weight="bold" font-size="140" fill="white" letter-spacing="-2">
    Nova<tspan fill="#FF9900">Vision</tspan>
  </text>
  <text x="455" y="300" font-family="Arial, sans-serif" font-size="40" fill="#94a3b8" letter-spacing="4">
    INTELLIGENCE
  </text>
</svg>
